<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago con tarjeta</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FFFFFF;
            color: #1F2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            box-sizing: border-box;
            padding: 16px;
            text-align: center;
        }

        #encabezado {
            margin-bottom: 20px;
        }

        #encabezado h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: #111827;
        }

        #encabezado p {
            font-size: 13px;
            color: #6B7280;
            margin: 0;
        }

        #frmVisaNet {
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="encabezado">
        <h1>Pago con tarjeta</h1>
        <p>Su información es procesada de forma segura por Niubiz</p>
    </div>

    <form id="frmVisaNet" method="POST" action="https://checkoutniubiz.invalid/ok"></form>

    <script type="text/javascript">
        (function () {
            var params = new URLSearchParams(window.location.search);

            var checkoutJs =
                params.get("checkoutJs") ||
                "https://static-content-qas.vnforapps.com/v2/js/checkout.js?qa=true";

            var sessionToken =
                params.get("session") || "";

            var merchantId =
                params.get("merchant") || "";

            var purchaseNumber =
                params.get("purchase") || "";

            var amount =
                params.get("amount") || "0.00";

            var currency =
                params.get("currency") || "PEN";

            window.culqiSuccessCallback = function (token) {
                window.chrome.webview.postMessage(
                    JSON.stringify({ token: token.token }));
            };

            window.culqiDangerCallback = function (dangerCode, dangerMessage, dangerType) {
                window.chrome.webview.postMessage(
                    JSON.stringify({
                        error: true,
                        codigo: dangerCode,
                        mensaje: dangerMessage,
                        tipo: dangerType
                    }));
            };

            window.onerror = function (mensaje, fuente, linea, columna, error) {
                window.chrome.webview.postMessage(
                    JSON.stringify({
                        error: true,
                        tipo: "js",
                        mensaje: String(mensaje) +
                            " (en línea " + linea + " de " + fuente + ")"
                    }));
            };

            function crearCheckout() {
                var form = document.getElementById("frmVisaNet");

                if (!form) {
                    return;
                }

                var script = document.createElement("script");
                script.type = "text/javascript";
                script.src = checkoutJs;
                script.setAttribute("data-sessiontoken", sessionToken);
                script.setAttribute("data-channel", "web");
                script.setAttribute("data-merchantid", merchantId);
                script.setAttribute("data-purchasenumber", purchaseNumber);
                script.setAttribute("data-amount", amount);
                script.setAttribute("data-currency", currency);
                script.setAttribute("data-expirationminutes", "20");
                script.setAttribute("data-timeouturl", "about:blank");

                form.appendChild(script);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", crearCheckout);
            } else {
                crearCheckout();
            }
        })();
    </script>

</body>
</html>
